version: "3.9"

# ─────────────────────────────────────────────────────────
# PRODUCTION / COOLIFY / VPS DEPLOYMENT
# Set all env vars in Coolify UI or .env.production
# ─────────────────────────────────────────────────────────

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ims_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      BASE_URL: ${BASE_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Company ERP}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.0}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - app_uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_uploads:
